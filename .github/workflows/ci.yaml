name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: luxass/shared-workflows/.github/workflows/reusable-ci.yaml@411fe8f8a0a53eab5153356ac5e0f174cd245eb2 # v0.17.1
    with:
      build-script: "build"
      lint-script: "lint"
      fmt: true
      fmt-script: "fmt:check"
      typecheck-script: "typecheck"

  test:
    permissions:
      contents: read
    strategy:
      matrix:
        node: [22, 24]
      fail-fast: false
    uses: luxass/shared-workflows/.github/workflows/reusable-test.yaml@411fe8f8a0a53eab5153356ac5e0f174cd245eb2 # v0.17.1
    with:
      node-version: ${{ matrix.node }}
