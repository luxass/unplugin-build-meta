ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true
packages:
  - examples/**

catalogs:
  dev:
    "@nuxt/kit": 4.4.7
    "@nuxt/schema": 4.4.7
    "@rspack/core": 2.3.1
    "@types/node": 25.9.2
    esbuild: 0.28.2
    oxfmt: 0.53.0
    oxlint: 1.91.0
    oxlint-tsgolint: 7.0.2005
    publint: 0.3.21
    rolldown: 1.1.0
    rollup: 4.67.4
    tsdown: 0.22.2
    typescript: 6.0.3
    vite: 8.3.5
    vitest: 5.1.0
    vitest-testdirs: 4.4.3
    webpack: 5.112.2

  example:
    "@rspack/cli": 2.3.1
    "@rspack/dev-server": 2.0.3

  prod:
    git-url-parse: 16.1.0
    simple-git: 4.0.2
    unplugin: 3.7.0

onlyBuiltDependencies:
  - esbuild
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.8.0 || 11.11.0
  - pnpm@11.8.0 || 11.11.0
