ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true
packages:
  - examples/**

catalogs:
  dev:
    "@nuxt/kit": 4.6.2
    "@nuxt/schema": 4.6.2
    "@rspack/core": 2.2.9
    "@types/node": 25.9.9
    esbuild: 0.28.0
    oxfmt: 0.73.0
    oxlint: 1.68.0
    oxlint-tsgolint: 0.25.0
    publint: 0.3.25
    rolldown: 1.2.14
    rollup: 4.64.8
    tsdown: 0.23.1
    typescript: 6.0.3
    vite: 8.0.16
    vitest: 4.1.8
    vitest-testdirs: 4.5.2
    webpack: 5.112.0

  example:
    "@rspack/cli": 2.2.9
    "@rspack/dev-server": 2.2.1

  prod:
    git-url-parse: 16.1.0
    simple-git: 3.36.0
    unplugin: 3.4.0

onlyBuiltDependencies:
  - esbuild
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.8.0 || 11.11.0
  - pnpm@11.8.0 || 11.11.0
